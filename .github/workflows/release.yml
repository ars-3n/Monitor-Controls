name: Release Monitor Controls

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A push can carry several commits. Only the last one is released.
  release:
    name: Release ${{ github.sha }}
    runs-on: macos-26
    permissions:
      contents: write
    concurrency: release-${{ github.sha }}
    env:
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The release notes list the commits of the push.
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$SIGNING_CERTIFICATE_P12" ]]; then
            echo "No signing certificate is configured. The app will be signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/signing.p12"
          echo -n "$SIGNING_CERTIFICATE_P12" | base64 --decode -o "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$certificate"
          # This command prints the key's attributes. Keep them out of the public log.
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          # A self-signed certificate is listed even though the runner does not trust it.
          identity="$(security find-identity -p codesigning "$keychain" | awk '/^ *1\)/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "The certificate contains no code signing identity." >&2
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build app
        run: ./scripts/build.sh
      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)
          tag="v$version-${REVISION:0:12}"
          title="Monitor Controls $version (${REVISION:0:7})"
          notes="$RUNNER_TEMP/release-notes.md"
          # What the push changed, without the commit that only raises the version.
          # A forced push has no usable start, so fall back to the last commit.
          if ! changes=$(git log --reverse --format=%s --invert-grep --grep='^Bump the version to ' "$BEFORE..$REVISION" 2>/dev/null) || [[ -z "$changes" ]]; then
            changes=$(git log -1 --format=%s)
          fi
          if [[ $(wc -l <<< "$changes") -gt 1 ]]; then changes=$(sed 's/^/- /' <<< "$changes"); fi
          printf '%s\n\n' "$changes" > "$notes"
          echo 'Download MonitorControls.zip, unzip it, and move Monitor Controls.app to Applications. Requires a Mac with Apple silicon and macOS 14 or later. This build has no Developer ID signature or notarization.' >> "$notes"

          # Keep partially uploaded releases in draft so a rerun can finish them.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then exit 0; fi
          else
            gh release create "$tag" --target "$REVISION" --draft --title "$title" --notes-file "$notes"
          fi
          gh release upload "$tag" dist/MonitorControls.zip --clobber
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          latest=false
          if [[ "$REVISION" == "$head" ]]; then latest=true; fi
          gh release edit "$tag" --draft=false --latest="$latest"
